<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 120" width="620" height="120">
  <!-- IEEE PELS Symbol (Left) -->
  <g transform="translate(10, 10)">
    <!-- PELS font -->
    <text x="0" y="45" font-family="Arial, sans-serif" font-weight="bold" font-size="42" fill="#C8102E">pels</text>
    <!-- Line under pels -->
    <line x1="0" y1="52" x2="90" y2="52" stroke="#C8102E" stroke-width="4"/>
    <!-- Triangle base -->
    <polygon points="45,56 5,100 85,100" fill="#C8102E"/>
    <!-- Pulse Line inside triangle -->
    <path d="M12,85 L35,85 L35,68 L55,68 L55,95 L80,95" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="miter"/>
  </g>
  
  <!-- IEEE POWER ELECTRONICS SOCIETY Text (Right of Symbol) -->
  <g transform="translate(110, 20)">
    <text x="0" y="28" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#C8102E" letter-spacing="-0.5">IEEE POWER</text>
    <text x="0" y="60" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="900" font-size="30" fill="#C8102E" letter-spacing="-0.5">ELECTRONICS SOCIETY</text>
    <text x="0" y="90" font-family="'Space Grotesk', 'Arial Black', sans-serif" font-weight="700" font-size="20" fill="#4285F4" letter-spacing="1">SSN STUDENT BRANCH CHAPTER</text>
  </g>
</svg>
