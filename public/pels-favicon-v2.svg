<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g transform="translate(0, 0)">
    <!-- pels bold stylized text -->
    <text x="100" y="42" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="#E31837" letter-spacing="-1">pels</text>
    
    <!-- Red separator bar -->
    <rect x="25" y="48" width="150" height="7" rx="3" fill="#E31837" />
    
    <!-- Red Triangle Base -->
    <polygon points="100,58 32,152 168,152" fill="#E31837" />
    
    <!-- IEEE Diamond Blue Logo (Left of triangle) -->
    <g transform="translate(14, 98) scale(0.65)">
      <polygon points="15,0 30,15 15,30 0,15" fill="#006699" />
      <text x="15" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">IEEE</text>
    </g>
    
    <!-- SSN Blue Logo (Right of triangle) -->
    <text x="182" y="112" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#006699">SSN</text>
    
    <!-- White Square Wave Pulse Inside Triangle -->
    <path d="M 45 118 L 88 118 L 88 88 L 112 88 L 112 136 L 155 136" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter" />
    
    <!-- Subtitle Text -->
    <text x="100" y="174" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#006699" letter-spacing="0.5">STUDENT BRANCH CHAPTER</text>
  </g>
</svg>
